#cloud-config
# Bootstrap source only. Do not put access/inference tokens into cloud-init logs.
# After provisioning, copy an existing private access-token file to the VM and run
# ACCESS_TOKEN_SOURCE=/private/path DOMAIN=... REPO=... bash deploy/setup.sh over SSH.
packages:
  - git
runcmd:
  - [git, clone, "https://github.com/YOUR_USER/safecode-agent", /opt/safecode/app]
